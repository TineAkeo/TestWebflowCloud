<script>
(function(){

var KEY='reframe:progress';
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}

function chapterId(){var m=location.pathname.match(/chapter\d+/);return m?m[0]:'chapter'}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

function initTrack(){
 var viewport=document.querySelector('[data-track]');if(!viewport)return;
 var inner=document.querySelector('[data-track-inner]');if(!inner)return;

 var parallaxEls=Array.prototype.map.call(viewport.querySelectorAll('[data-parallax]'),function(el){
  var factor=parseFloat(el.getAttribute('data-parallax'))||0;
  var nested=inner.contains(el);
  var panelOffset=0;
  if(nested){
   var ownerPanel=el.closest('.panel');
   if(ownerPanel){
    panelOffset=ownerPanel.getBoundingClientRect().left-viewportRect.left;

  }

  if(!thumb||!barTrack)return;
  var trackWidth=barTrack.clientWidth;
  var ratio=trackWidth/(trackWidth+maxScroll)||1;
  var thumbWidth=Math.max(trackWidth*ratio,24);
  thumb.style.width=thumbWidth+'px';
  thumb.dataset.thumbWidth=thumbWidth;

  inner.style.transform='translate3d('+(-current)+'px,0,0)';
  for(var i=0;i<parallaxEls.length;i++){
   var p=parallaxEls[i];
   var shift;
   if(p.nested){
    shift=(current-p.panelOffset)*(1-p.factor);
   }else{
    shift=-current*p.factor;
   }
   p.el.style.transform='translate3d('+shift+'px,0,0)';
  }
  if(thumb&&barTrack){
   var trackWidth=barTrack.clientWidth;
   var thumbWidth=parseFloat(thumb.dataset.thumbWidth||24);
   var travel=Math.max(trackWidth-thumbWidth,1);
   var p2=maxScroll>0?current/maxScroll:0;
   thumb.style.transform='translate3d('+(p2*travel)+'px,0,0)';
  }
  save(chapterId()+':scroll',maxScroll>0?Math.round((current/maxScroll)*100):0);

  var diff=target-current;
  if(Math.abs(diff)<0.5){
   current=target;render();raf=null;return;
  }
  current+=diff*0.11;

  var rel=clamp(clientX-rect.left-thumbWidth/2,0,travel);

  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){target=clamp(target-step,0,maxScroll);play();e.preventDefault()}
  else if(e.key==='Home'){target=0;play();e.preventDefault()}
  else if(e.key==='End'){target=maxScroll;play();e.preventDefault()}
 });

 window.addEventListener('resize',recalc);
 recalc();
 render();
}

function initPlayers(){
 Array.prototype.forEach.call(document.querySelectorAll('[data-player]'),function(p){
  var src=p.getAttribute('data-src');
  var frame=p.querySelector('.player__frame');
  var btn=p.querySelector('[data-player-toggle]');
  var fill=p.querySelector('[data-player-fill]');
  var time=p.querySelector('[data-player-time]');
  if(!src){if(btn){btn.disabled=true;btn.style.opacity='.4';btn.style.cursor='not-allowed'}return}
  var v=document.createElement('video');
  v.src=src;v.playsInline=true;v.preload='metadata';
  var poster=p.getAttribute('data-poster');if(poster)v.poster=poster;
  frame.innerHTML='';frame.appendChild(v);
  function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
  if(btn)btn.addEventListener('click',function(){v.paused?v.play():v.pause()});
  v.addEventListener('play',function(){if(btn)btn.textContent='Pause'});
  v.addEventListener('pause',function(){if(btn)btn.textContent='Play'});
  v.addEventListener('timeupdate',function(){
   if(fill&&v.duration)fill.style.width=(v.currentTime/v.duration*100).toFixed(2)+'%';
   if(time)time.textContent=fmt(v.currentTime);
  });
  v.addEventListener('ended',function(){save(chapterId()+':video',true)});
 });
}

function initMemory(){
 var el=document.querySelector('[data-memory]');if(!el)return;
 var status=document.querySelector('[data-memory-status]');
 var pairs=parseInt(el.getAttribute('data-pairs'),10)||6;
 var faces='ABCDEFGHIJKL'.split('').slice(0,pairs);
 var deck=faces.concat(faces);
 for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t}
 var open=[],found=0,lock=false;
 function render(){if(status)status.textContent=found+' / '+pairs+' pairs found'}
 el.innerHTML='';
 deck.forEach(function(face){
  var c=document.createElement('div');
  c.className='memory__card';c.textContent=face;
  c.addEventListener('click',function(){
   if(lock||c.classList.contains('is-open')||c.classList.contains('is-done'))return;
   c.classList.add('is-open');open.push(c);
   if(open.length<2)return;
   lock=true;
   var a=open[0],b=open[1];
   if(a.textContent===b.textContent){
    setTimeout(function(){
     a.classList.add('is-done');b.classList.add('is-done');
     a.classList.remove('is-open');b.classList.remove('is-open');
     open=[];lock=false;found++;render();
     if(found===pairs){save(chapterId()+':memory',true);el.dispatchEvent(new CustomEvent('memory:complete',{bubbles:true}))}
    },320);
   }else{
    setTimeout(function(){a.classList.remove('is-open');b.classList.remove('is-open');open=[];lock=false},700);
   }
  });
  el.appendChild(c);
 });
 render();
}

function init(){initTrack();initPlayers();initMemory()}
if(document.readyState!=='loading'){init()}else{document.addEventListener('DOMContentLoaded',init)}
})();
</script>

bH.addEventListener('click',function(){if(ck){lk[ck]=!lk[ck];try{localStorage.setItem(LK,JSON.stringify(lk))}catch(e){}bH.textContent=lk[ck]?'♥':'♡'}});
document.addEventListener('keydown',function(e){if(!M||!M.classList.contains('is-open'))return;e.stopPropagation();if(e.code==='Escape')cl();if(e.code==='Space'||e.code==='KeyK'){e.preventDefault();tog()}if(e.code==='ArrowRight')V.currentTime=Math.min(V.duration||0,V.currentTime+5);if(e.code==='ArrowLeft')V.currentTime=Math.max(0,V.currentTime-5)},true);
document.addEventListener('click',function(e){

},true);}
if(document.readyState!=='loading')init();
else document.addEventListener('DOMContentLoaded',init);
})();

<script>
/* === GSAP Splash === */
(function(){
'use strict';
var splash=document.querySelector('.splash');
if(!splash)return;
splash.classList.add('is-active');
var curtain=document.getElementById('splashCurtain');
var logo=document.getElementById('splashLogo');
var tagline=document.getElementById('splashTagline');
if(typeof gsap==='undefined'){
  setTimeout(function(){if(logo)logo.style.opacity='1';if(tagline)tagline.style.opacity='1';},80);
  setTimeout(function(){if(logo)logo.style.opacity='0';if(curtain)curtain.style.transform='translateX(-100%)';if(tagline)tagline.style.opacity='0';},2500);
  setTimeout(function(){splash.classList.add('is-done');},3100);
  return;
}
gsap.timeline({onComplete:function(){splash.classList.add('is-done');document.dispatchEvent(new CustomEvent('splash:done'));}})
  .fromTo(logo,    {opacity:0},        {opacity:1,duration:0.7,ease:'power2.out'},0.08)
  .fromTo(tagline, {opacity:0,y:10},   {opacity:1,y:0,duration:0.6,ease:'power2.out'},0.25)
  .to(curtain,{xPercent:-100,duration:0.55,ease:'power2.inOut'},2.45)
  .to(logo,   {opacity:0,duration:0.35,ease:'power1.in'},2.5)
  .to(tagline,{opacity:0,y:-6,duration:0.3,ease:'power1.in'},2.55);
})();
</script>
<script>
/* === Chapter Title — Blur cascade (Splitting.js) === */
(function(){
'use strict';
if(typeof Splitting==='undefined'||typeof gsap==='undefined') return;
var els=Array.prototype.slice.call(document.querySelectorAll('.chapter-title'));
if(!els.length) return;
els.forEach(function(el){
  Splitting({target:el});
  gsap.set(el.querySelectorAll('.char'),{opacity:0,filter:'blur(10px)'});
});
function animEl(el){
  gsap.to(el.querySelectorAll('.char'),{
    opacity:1,filter:'blur(0px)',
    duration:0.65,ease:'power2.out',
    stagger:{amount:0.55}
  });
}
var pending=els.slice();
function checkAll(){
  if(!pending.length) return;
  var next=[];
  pending.forEach(function(el){
    var r=el.getBoundingClientRect();
    if(r.left<window.innerWidth*0.75){ animEl(el); }
    else{ next.push(el); }
  });
  pending=next;
  if(pending.length) requestAnimationFrame(checkAll);
}
function start(){ requestAnimationFrame(checkAll); }
if(document.querySelector('.splash')){
  var fired=false;
  document.addEventListener('splash:done',function(){ if(!fired){fired=true;start();} });
  setTimeout(function(){ if(!fired){fired=true;start();} },3200);
} else {
  start();
}
})();
</script><script src="/app/offline.js" data-offline="installed"></script></body></html>
